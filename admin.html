<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Capital - Admin Approval Panel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        h1 { font-size: 24px; color: #f59e0b; }
        .btn { background: var(--accent-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--text-muted); font-weight: 600; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; display: none; }
        .alert-success { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
        .alert-error { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nova Capital Admin Panel</h1>
            <button class="btn" onclick="window.location.href='dashboard.html'">Go to User Dashboard</button>
        </header>

        <div id="alertBox" class="alert"></div>

        <div class="card">
            <h3>Pending Transactions & Deposit Requests</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>User Email</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    <tbody id="transactionTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--text-muted);">Loading transactions...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://nova-capital-backend.onrender.com';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'index.html';
        }

        function showAlert(message, isSuccess = true) {
            const box = document.getElementById('alertBox');
            box.textContent = message;
            box.className = `alert ${isSuccess ? 'alert-success' : 'alert-error'}`;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        async function fetchPendingTransactions() {
            try {
                // Adjust endpoint if your backend uses a specific route for admin transaction lists
                const response = await fetch(`${API_URL}/api/admin/transactions`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                const tbody = document.getElementById('transactionTableBody');
                tbody.innerHTML = '';

                if (response.ok && data.length > 0) {
                    data.forEach(tx => {
                        if (tx.status === 'pending') {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${tx.userEmail || 'Client'}</td>
                                <td style="text-transform: uppercase;">${tx.type}</td>
                                <td>$${tx.amount.toFixed(2)}</td>
                                <td><span class="badge badge-pending">Pending</span></td>
                                <td>
                                    <button class="btn btn-success" onclick="updateTransaction('${tx._id}', 'approved')">Approve</button>
                                    <button class="btn btn-danger" onclick="updateTransaction('${tx._id}', 'rejected')">Reject</button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        }
                    });
                    if (tbody.innerHTML === '') {
                        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No pending transactions found.</td></tr>`;
                    }
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No pending requests or unauthorized.</td></tr>`;
                }
            } catch (err) {
                console.error('Error fetching admin transactions:', err);
            }
        }

        async function updateTransaction(transactionId, status) {
            try {
                const res = await fetch(`${API_URL}/api/admin/transaction/${transactionId}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ status })
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert(`Transaction successfully ${status}!`);
                    fetchPendingTransactions();
                } else {
                    showAlert(data.message || 'Failed to update transaction', false);
                }
            } catch (err) {
                showAlert('Network error connecting to server', false);
            }
        }

        fetchPendingTransactions();
    </script>
</body>
</html>
