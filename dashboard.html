<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Capital - User Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        h1 { font-size: 24px; color: var(--accent-color); }
        .btn { background: var(--accent-color); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: var(--accent-hover); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h3 { font-size: 16px; color: var(--text-muted); margin-bottom: 10px; }
        .balance { font-size: 32px; font-weight: bold; color: var(--success); }
        form { display: flex; flex-direction: column; gap: 12px; }
        input { background: var(--bg-color); border: 1px solid var(--border); padding: 12px; border-radius: 6px; color: white; font-size: 15px; }
        input:focus { outline: none; border-color: var(--accent-color); }
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; display: none; }
        .alert-success { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
        .alert-error { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nova Capital Dashboard</h1>
            <div>
                <span id="userEmail" style="margin-right: 15px; color: var(--text-muted);"></span>
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </header>

        <div id="alertBox" class="alert"></div>

        <div class="grid">
            <!-- Balance Card -->
            <div class="card">
                <h3>Account Balance</h3>
                <div class="balance" id="userBalance">$0.00</div>
            </div>

            <!-- Deposit Card -->
            <div class="card">
                <h3>Request Deposit</h3>
                <form id="depositForm">
                    <input type="number" id="depositAmount" placeholder="Amount (USD)" required min="1">
                    <button type="submit" class="btn">Submit Deposit</button>
                </form>
            </div>
        </div>

        <!-- Withdrawal Card -->
        <div class="card" style="max-width: 430px;">
            <h3>Request Withdrawal</h3>
            <form id="withdrawalForm">
                <input type="number" id="withdrawalAmount" placeholder="Amount (USD)" required min="1">
                <button type="submit" class="btn" style="background: #f59e0b;">Submit Withdrawal</button>
            </form>
        </div>
    </div>

    <script>
        // Point this to your live backend URL on Render
        const API_URL = 'https://nova-capital-backend.onrender.com';
        const token = localStorage.getItem('token');

        // Redirect to login if not authenticated (You can build login.html next)
        if (!token) {
            window.location.href = 'index.html'; 
        }

        function showAlert(message, isSuccess = true) {
            const box = document.getElementById('alertBox');
            box.textContent = message;
            box.className = `alert ${isSuccess ? 'alert-success' : 'alert-error'}`;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        async function fetchUserData() {
            try {
                const response = await fetch(`${API_URL}/api/user/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('userBalance').textContent = `$${data.balance.toFixed(2)}`;
                    document.getElementById('userEmail').textContent = data.email;
                } else {
                    if(response.status === 401) logout();
                }
            } catch (err) {
                console.error('Error fetching profile:', err);
            }
        }

        // Handle Deposit Request
        document.getElementById('depositForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = document.getElementById('depositAmount').value;
            
            try {
                const res = await fetch(`${API_URL}/api/transactions/deposit`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ amount: Number(amount) })
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert('Deposit request submitted successfully! Pending admin approval.');
                    document.getElementById('depositAmount').value = '';
                    fetchUserData();
                } else {
                    showAlert(data.message || 'Deposit failed', false);
                }
            } catch (err) {
                showAlert('Network error connecting to server', false);
            }
        });

        // Handle Withdrawal Request
        document.getElementById('withdrawalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = document.getElementById('withdrawalAmount').value;
            
            try {
                const res = await fetch(`${API_URL}/api/transactions/withdraw`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ amount: Number(amount) })
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert('Withdrawal request submitted successfully!');
                    document.getElementById('withdrawalAmount').value = '';
                    fetchUserData();
                } else {
                    showAlert(data.message || 'Withdrawal failed', false);
                }
            } catch (err) {
                showAlert('Network error connecting to server', false);
            }
        });

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        // Load data on page open
        fetchUserData();
    </script>
</body>
</html>
